name: Web browser regression

on:
  pull_request:
    paths:
      - 'web/**'
      - 'opencode/packages/opencode/src/pty/**'
      - 'opencode/packages/opencode/src/server/routes/agent-terminal.ts'
      - 'opencode/packages/opencode/test/tool/terminal-buffer-snapshot.test.ts'
      - 'opencode/packages/opencode/test/tool/screen-buffer.test.ts'
      - '.github/workflows/web-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # Keep Chrome's sandbox enabled; 22.04 supports its user namespace sandbox.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: |
          bun install
          bun install --cwd opencode
      - name: Typecheck browser cases and production components
        run: web/node_modules/.bin/vue-tsc -p web/test/browser/tsconfig.json
      - name: Test terminal snapshot consistency with the real headless parser
        run: bun test --cwd opencode/packages/opencode test/tool/terminal-buffer-snapshot.test.ts test/tool/screen-buffer.test.ts
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Test production components in Chrome
        env:
          RUN_WEB_BROWSER: '1'
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bun test web/test/browser-regression.test.ts
